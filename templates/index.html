<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <p>Search for any city in the world</p>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                autocomplete="off"
            />
            <button id="searchBtn">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <!-- Error Message -->
        <div class="error-box" id="errorBox">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMsg">City not found</span>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <span>Searching...</span>
        </div>

        <!-- Weather Card -->
        <div class="weather-card" id="weatherCard">
            <div class="card-top">
                <div class="city-info">
                    <h2 id="cityName">--</h2>
                    <p id="countryName">--</p>
                </div>
                <img id="weatherIcon" src="" alt="weather icon"/>
            </div>

            <div class="temp-box">
                <h1 id="temperature">--°C</h1>
                <p id="description">--</p>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <i class="fas fa-thermometer-half"></i>
                    <span>Feels Like</span>
                    <strong id="feelsLike">--°C</strong>
                </div>
                <div class="detail-item">
                    <i class="fas fa-tint"></i>
                    <span>Humidity</span>
                    <strong id="humidity">--%</strong>
                </div>
                <div class="detail-item">
                    <i class="fas fa-wind"></i>
                    <span>Wind Speed</span>
                    <strong id="windSpeed">-- m/s</strong>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
